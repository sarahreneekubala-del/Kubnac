<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice Time!</title>
<style>
:root{
  --ink:#263238; --muted:#607d8b;
  --green:#43a047; --red:#e53935; --blue:#1e88e5; --purple:#7c4dff; --orange:#fb8c00;
  --pink:#ec407a; --teal:#00897b; --gray:#78909c; --yellow:#ffca28;
  --wordfont:"Century Gothic","Andika","Comic Sans MS","Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI Rounded","Arial Rounded MT Bold","Segoe UI",Arial,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#fff8e1 0%,#e1f5fe 60%,#f3e5f5 100%);background-attachment:fixed;min-height:100vh;font-size:22px}
#app{max-width:980px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:40px;margin:10px 0}
h2{font-size:30px;margin:6px 0 12px}
p{line-height:1.45}
button{font-family:inherit;cursor:pointer;border:none;border-radius:18px;font-size:24px;font-weight:700;padding:14px 22px;color:#fff;
  background:var(--blue);box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s;margin:4px;line-height:1.2}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:4px solid #ffd54f;outline-offset:2px}
.btn-green{background:var(--green)} .btn-red{background:var(--red)} .btn-blue{background:var(--blue)}
.btn-purple{background:var(--purple)} .btn-orange{background:var(--orange)} .btn-pink{background:var(--pink)}
.btn-teal{background:var(--teal)} .btn-gray{background:var(--gray)} .btn-white{background:#fff;color:var(--ink)}
.small{font-size:17px;padding:9px 14px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.big{font-size:30px;padding:18px 30px;border-radius:22px}
.huge{font-size:64px;min-width:150px;padding:14px 30px;border-radius:26px}
.muted{color:var(--muted)}
input,textarea,select{font-family:inherit;font-size:22px;padding:10px 14px;border:3px solid #b0bec5;border-radius:14px;width:100%;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)}
label{display:block;font-weight:700;margin:14px 0 6px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* home */
.title{font-size:52px;text-align:center;margin:20px 0 6px;color:#5e35b1;text-shadow:3px 3px 0 #fff}
.subtitle{text-align:center;font-size:30px;margin:0 0 26px}
.kidgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.kidbtn{min-height:190px;font-size:52px;border-radius:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;margin:0}
.kidstars{font-size:26px;background:rgba(255,255,255,.3);padding:4px 18px;border-radius:30px}
.gear{position:fixed;top:12px;right:12px;font-size:26px;padding:8px 12px;background:#fff;color:#000;border-radius:16px;z-index:5}
.homefoot{text-align:center;margin-top:36px}
.warn{background:#fff3e0;border:3px solid #ffb74d;border-radius:18px;padding:12px 16px;margin:14px 0;font-size:20px}
.info{background:#e3f2fd;border:3px solid #90caf9;border-radius:18px;padding:12px 16px;margin:14px 0;font-size:20px}

/* kid page */
.modegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px;margin-top:20px}
.modebtn{min-height:170px;font-size:38px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:0}
.modebtn .em{font-size:64px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* lesson */
.lessonbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.lbmid{flex:1;text-align:center;font-size:28px;font-weight:800}
.lbstars{font-size:28px;font-weight:800;background:#fff;border-radius:20px;padding:6px 16px;box-shadow:0 3px 8px rgba(0,0,0,.1)}
.lbstars small{font-size:18px;color:var(--muted)}
.card{background:#fff;border-radius:34px;padding:22px 20px 18px;box-shadow:0 10px 30px rgba(0,0,0,.12);text-align:center;position:relative;border:7px solid #ffe082}
.card.review{background:#f3e5f5;border-color:#ba68c8}
.card.newsound{border-color:#4fc3f7;background:#e1f5fe}
.card.spell{border-color:#b39ddb}
.card.banner{border-color:#ba68c8;background:#f3e5f5;padding:40px 20px}
.tag{display:inline-block;font-size:22px;font-weight:800;padding:6px 18px;border-radius:20px;color:#fff;background:var(--orange)}
.tag.rev{background:#8e24aa}
.word{font-family:var(--wordfont);font-size:clamp(64px,14vw,150px);font-weight:700;margin:26px 0 18px;line-height:1.15;word-break:break-word}
.word.sound{font-size:clamp(90px,22vw,210px);color:#0277bd}
.hl{color:#d81b60;background:#fff59d;border-radius:14px;padding:0 .04em}
.ctrlrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.hint{font-size:24px;margin:10px 0}
.mic.listening{background:#ff1744;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.feedback{min-height:34px;font-size:24px;font-weight:700;margin:8px 0}
.overrow{margin-top:14px}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(255,255,255,.55);z-index:50;pointer-events:none}
.bigcheck{font-size:220px;line-height:1;color:#2e7d32;animation:pop .45s ease-out}
.praise{font-size:56px;font-weight:900;color:#5e35b1;animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.segs{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px;margin:18px 0}
.seg{font-family:var(--wordfont);font-size:clamp(44px,9vw,72px);font-weight:700;color:#fff;padding:8px 22px;border-radius:20px;min-width:80px;transition:transform .2s,box-shadow .2s;opacity:.8;display:flex;flex-direction:column;align-items:center}
.seg small{font-size:18px}
.seg.on{transform:scale(1.2);opacity:1;box-shadow:0 0 0 7px #ffeb3b}
.seg.silent{background:#b0bec5 !important}
.dash{font-size:44px;font-weight:900;color:#90a4ae}
.heartword{padding-top:.45em}
.letter{position:relative;display:inline-block;transition:transform .2s,color .2s;padding:0 .02em}
.letter.on{color:var(--blue);transform:scale(1.2)}
.letter.glow{color:#e53935}
.hm{position:absolute;top:-.5em;left:50%;transform:translateX(-50%);font-size:.42em;color:#e53935;line-height:1}
.spellbox{font-family:var(--wordfont);font-size:clamp(40px,8vw,64px);text-align:center;max-width:620px;letter-spacing:.06em;margin:10px auto;display:block;border-width:5px;border-radius:22px}
.cmp{margin:14px auto;display:inline-block;text-align:left}
.cmprow{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}
.cmplabel{font-size:22px;font-weight:800;width:190px}
.cmpword{font-family:var(--wordfont);font-size:clamp(36px,7vw,58px);font-weight:700;display:flex;gap:2px}
.cmpword span{padding:0 5px;border-radius:10px;min-width:.6em;text-align:center}
.cmpword .bad{background:#ffcdd2;color:#c62828}
.cmpword .fix{background:#c8e6c9;color:#1b5e20}
.bigemoji{font-size:110px}

/* done */
.done h1{font-size:54px;color:#5e35b1}
.starrow{font-size:60px;margin:10px 0;word-break:break-all}
.stat{font-size:30px;font-weight:800;margin:8px 0}
.missbox{background:#fff8e1;border:3px dashed #ffb74d;border-radius:20px;padding:14px;margin:18px auto;max-width:640px}
.chip{display:inline-block;background:#fff;border:3px solid #ffb74d;border-radius:30px;padding:4px 16px;margin:5px;font-size:24px;font-weight:700}
.confetti{position:fixed;top:-60px;font-size:34px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

/* pin */
.pinwrap{max-width:420px;margin:30px auto;text-align:center}
.dots{display:flex;justify-content:center;gap:18px;margin:20px 0}
.dot{width:34px;height:34px;border-radius:50%;border:4px solid #5e35b1;background:#fff}
.dot.full{background:#5e35b1}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keypad button{font-size:38px;padding:18px 0;margin:0;background:#fff;color:var(--ink)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}

/* settings */
.panel{background:#fff;border-radius:26px;padding:18px 20px;margin:18px 0;box-shadow:0 6px 18px rgba(0,0,0,.08)}
.panel h2{display:flex;align-items:center;gap:10px}
.lrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:2px solid #eceff1;padding:10px 0}
.lrow:last-of-type{border-bottom:none}
.lname{flex:1;min-width:200px;font-size:24px;font-weight:700}
.snd{font-family:var(--wordfont);font-size:32px;color:#0277bd;margin-right:6px}
.badge{display:inline-block;font-size:15px;font-weight:800;border-radius:12px;padding:3px 10px;color:#fff;vertical-align:middle;margin-left:6px}
.badge.new{background:var(--orange)} .badge.review{background:#8e24aa}
.toggle{background:#cfd8dc;color:var(--ink)}
.toggle.on{background:var(--green);color:#fff}
.swatch{width:46px;height:46px;border-radius:50%;padding:0;border:4px solid #fff;box-shadow:0 0 0 2px #b0bec5}
.swatch.sel{box-shadow:0 0 0 5px var(--ink)}
.kidrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px solid #eceff1;flex-wrap:wrap}
.kiddot{width:30px;height:30px;border-radius:50%}
.numin{width:110px;text-align:center}
.trickrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:10px 0}
.letterbtn{font-family:var(--wordfont);font-size:38px;min-width:60px;padding:22px 12px 8px;background:#eceff1;color:var(--ink);position:relative}
.letterbtn.on{background:#ffcdd2;color:#c62828}
.letterbtn .hm{top:2px;font-size:22px}
.sentrow{margin:10px 0;padding:10px;border-radius:16px;background:#f5f5f5}
.sentrow b{font-family:var(--wordfont);font-size:30px}
table{border-collapse:collapse;width:100%;font-size:19px}
th,td{border-bottom:2px solid #eceff1;padding:8px;text-align:left;vertical-align:top}
th{background:#ede7f6}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.setgrid button{min-height:110px;font-size:28px;margin:0}
.help h2{color:#5e35b1;margin-top:26px}
.help li{margin:8px 0;line-height:1.45}

/* modal + toast */
.modalwrap{position:fixed;inset:0;background:rgba(38,50,56,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:26px;padding:24px;max-width:560px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.mbtns{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:14px 26px;border-radius:30px;font-size:22px;font-weight:700;z-index:200;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:90vw;text-align:center}
@media (max-width:600px){ body{font-size:19px} .title{font-size:38px} .kidbtn{font-size:40px;min-height:150px} .cmplabel{width:auto} }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
'use strict';

/* =========================================================
   BASIC HELPERS
   ========================================================= */
var KEY = 'mommaPracticeApp.v1';
function app(){ return document.getElementById('app'); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3); }
function shuffle(a){ a = a.slice(); for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a,n){ return shuffle(a).slice(0, Math.max(0,n)); }
function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function clamp(v,lo,hi){ v = Number(v); if (isNaN(v)) v = lo; return Math.min(hi, Math.max(lo, v)); }
function dedupe(arr){ var seen = {}, out = []; arr.forEach(function(w){ var k = w.toLowerCase(); if (!seen[k]) { seen[k]=1; out.push(w); } }); return out; }
function parseWords(text){ return dedupe(String(text||'').split(/[,\n\r;\t]+/).map(function(w){ return w.trim().replace(/\s+/g,' '); }).filter(Boolean)); }
function plain(w){ return String(w).replace(/-/g,''); }   // phonics: dashes only mark sound breaks
function cleanColor(c, fallback){ return /^#[0-9a-f]{6}$/i.test(c||'') ? c : fallback; }

var KID_COLORS = ['#1e88e5','#ec407a','#43a047','#fb8c00','#7c4dff','#00acc1','#e53935','#8d6e63'];
var SEG_COLORS = ['#e53935','#fb8c00','#43a047','#1e88e5','#8e24aa','#00897b','#d81b60','#6d4c41'];
var MODES = {
  phonics:  { name:'Phonics',     icon:'🔤', cls:'btn-orange', empty:'phonics sounds' },
  heart:    { name:'Heart Words', icon:'❤️', cls:'btn-pink',   empty:'heart words' },
  spelling: { name:'Spelling',    icon:'✏️', cls:'btn-purple', empty:'spelling words' }
};
var MODE_KEYS = ['phonics','heart','spelling'];

/* How the speaker says each sound. Parents can change these in App Settings. */
var DEFAULT_SAY = {
  a:'ah', e:'eh', i:'ih', o:'aw', u:'uh',
  b:'buh', c:'kuh', d:'duh', f:'fff', g:'guh', h:'huh', j:'juh', k:'kuh', l:'lll', m:'mmm', n:'nnn',
  p:'puh', q:'kwuh', r:'rrr', s:'sss', t:'tuh', v:'vvv', w:'wuh', x:'ks', y:'yuh', z:'zzz',
  sh:'shh', ch:'chuh', th:'thh', wh:'wuh', ph:'fff', ck:'kuh', ng:'nng', nk:'nk', qu:'kwuh', kn:'nnn', wr:'rrr',
  tch:'chuh', dge:'juh', igh:'eye', eigh:'ay',
  ee:'ee', ea:'ee', oa:'oh', ai:'ay', ay:'ay', oo:'oo', ou:'ow', ow:'ow', oi:'oy', oy:'oy',
  ar:'ar', er:'er', ir:'er', ur:'er', or:'or', aw:'aw', au:'aw', ew:'oo', ie:'eye', ue:'oo', ey:'ay',
  ll:'lll', ss:'sss', ff:'fff', zz:'zzz',
  a_e:'ay', e_e:'ee', i_e:'eye', o_e:'oh', u_e:'you'
};
var GRAPHEMES = ['eigh','tch','dge','igh','sh','ch','th','wh','ph','ck','ng','nk','qu','kn','wr',
  'ee','ea','oa','ai','ay','oo','ou','ow','oi','oy','ar','er','ir','or','ur','aw','au','ew','ie','ue','ey','ll','ss','ff','zz'];
var LETTER_NAMES = {a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'el',m:'em',
  n:'en',o:'oh',p:'pee',q:'cue',r:'ar',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zee'};
var PRAISE = ['Great job!','You got it!','Awesome!','Super!','Way to go!','Fantastic!','Nice work!','You rock!'];

/* =========================================================
   DATA (saved automatically in this browser)
   ========================================================= */
function newKid(name, color){
  return { id:uid(), name:name, color:color, stars:0,
    modes:{ phonics:true, heart:true, spelling:true },
    counts:{ phonics:5, review:3, heart:10, spelling:10 },
    phonics:[], heart:[], spelling:[], history:[] };
}
function phonicsSound(sound, status, words){ return { id:uid(), sound:sound, say:'', status:status, words:parseWords(words).map(function(w){return w.toLowerCase();}) }; }

function defaults(){
  var j = newKid('Jackson', KID_COLORS[0]);
  j.phonics = [
    phonicsSound('sh','new','ship, shop, shed, shut, fish, dish, wish, cash, rush'),
    phonicsSound('ck','new','duck, sock, back, kick, rock, neck, sick, pack, lock'),
    phonicsSound('ng','new','ring, sing, king, wing, long, song, hang, bang, thing'),
    phonicsSound('ee','review','see, bee, tree, feet, seed, green, sheep, keep, week')
  ];
  var tricky = { the:[2], said:[1,2], was:[1], of:[0,1], to:[1], you:[1,2], are:[2], they:[2,3], what:[2] };
  j.heart = [{ id:uid(), name:'My Heart Words', status:'new',
    words: parseWords('the, said, was, of, to, you, are, they, said, what').map(function(w){ return { w:w, t:(tricky[w]||[]).slice() }; }) }];
  var a = newKid('Alexa', KID_COLORS[1]);
  return { app:'momma-practice-app', version:1, pin:null, parentName:'Momma',
    voiceURI:'', rate:0.85, useMic:true, sfx:true, maxTries:3, soundSay:{}, kids:[j, a] };
}

function normKid(k, idx){
  if (!k || typeof k !== 'object') return null;
  var n = newKid(String(k.name || 'Kid'), cleanColor(k.color, KID_COLORS[idx % KID_COLORS.length]));
  if (k.id) n.id = String(k.id).replace(/[^a-z0-9]/gi,'') || n.id;
  n.stars = Math.max(0, parseInt(k.stars,10) || 0);
  if (k.modes) MODE_KEYS.forEach(function(m){ if (typeof k.modes[m] === 'boolean') n.modes[m] = k.modes[m]; });
  if (k.counts) ['phonics','review','heart','spelling'].forEach(function(c){ if (k.counts[c] != null) n.counts[c] = clamp(k.counts[c], c==='review'?0:1, 50); });
  function normList(l, mode){
    if (!l || typeof l !== 'object') return null;
    var o = { id: String(l.id || uid()).replace(/[^a-z0-9]/gi,'') || uid(), status: l.status === 'review' ? 'review' : 'new' };
    var words = Array.isArray(l.words) ? l.words : [];
    if (mode === 'phonics'){
      o.sound = String(l.sound || ''); o.say = String(l.say || '');
      o.words = dedupe(words.map(function(w){ return String(typeof w === 'object' ? (w.w||'') : w).toLowerCase().trim(); }).filter(Boolean));
    } else {
      o.name = String(l.name || 'My List');
      var seen = {};
      o.words = [];
      words.forEach(function(w){
        var obj = typeof w === 'object' && w ? w : { w:String(w||'') };
        var text = String(obj.w || '').trim(); if (!text || seen[text.toLowerCase()]) return;
        seen[text.toLowerCase()] = 1;
        if (mode === 'heart') o.words.push({ w:text, t:(Array.isArray(obj.t)?obj.t:[]).map(Number).filter(function(i){ return i>=0 && i<text.length; }) });
        else o.words.push({ w:text, s:String(obj.s || '') });
      });
    }
    return o;
  }
  MODE_KEYS.forEach(function(m){ n[m] = (Array.isArray(k[m]) ? k[m] : []).map(function(l){ return normList(l,m); }).filter(Boolean); });
  n.history = (Array.isArray(k.history) ? k.history : []).filter(function(h){ return h && h.date; }).map(function(h){
    return { date:String(h.date), mode:MODES[h.mode] ? h.mode : 'phonics', total:+h.total||0, firstTry:+h.firstTry||0, stars:+h.stars||0,
      missed:Array.isArray(h.missed) ? h.missed.map(String) : [] };
  });
  return n;
}
function normalize(d){
  if (!d || typeof d !== 'object' || !Array.isArray(d.kids)) return null;
  var base = defaults();
  var o = { app:'momma-practice-app', version:1,
    pin: /^\d{4}$/.test(d.pin || '') ? d.pin : null,
    parentName: String(d.parentName || base.parentName),
    voiceURI: String(d.voiceURI || ''),
    rate: clamp(d.rate == null ? base.rate : d.rate, 0.4, 1.5),
    useMic: d.useMic !== false, sfx: d.sfx !== false,
    maxTries: clamp(d.maxTries == null ? 3 : d.maxTries, 1, 10),
    soundSay: {}, kids: [] };
  if (d.soundSay && typeof d.soundSay === 'object') Object.keys(d.soundSay).forEach(function(k){ o.soundSay[String(k).toLowerCase()] = String(d.soundSay[k]); });
  var ids = {};
  d.kids.forEach(function(k,i){ var nk = normKid(k,i); if (nk){ if (ids[nk.id]) nk.id = uid(); ids[nk.id]=1; o.kids.push(nk); } });
  return o;
}

var S = null, storageOK = true;
try { S = normalize(JSON.parse(localStorage.getItem(KEY))); } catch(e){ S = null; }
if (!S) S = defaults();
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; toast('Uh oh — this browser would not save. Please use Save Backup.'); }
}
save();

function getKid(id){ for (var i=0;i<S.kids.length;i++) if (S.kids[i].id === id) return S.kids[i]; return null; }
function getList(k, mode, id){ var a = k[mode]; for (var i=0;i<a.length;i++) if (a[i].id === id) return a[i]; return null; }
function sayFor(g){ g = String(g||'').toLowerCase(); return S.soundSay[g] || DEFAULT_SAY[g] || g; }
function pName(){ return esc(S.parentName || 'Momma'); }

/* =========================================================
   SOUNDS: speaking voice + happy/oops sounds
   ========================================================= */
var hasTTS = 'speechSynthesis' in window;
function voices(){ try { return hasTTS ? (speechSynthesis.getVoices() || []) : []; } catch(e){ return []; } }
function getVoice(){
  var vs = voices(); if (!vs.length) return null;
  if (S.voiceURI){ for (var i=0;i<vs.length;i++) if (vs[i].voiceURI === S.voiceURI) return vs[i]; }
  var en = vs.filter(function(v){ return /^en[-_]US/i.test(v.lang); });
  var pref = ['Ana','Aria','Jenny','Google US English','Zira'];
  for (var p=0;p<pref.length;p++){ for (var q=0;q<en.length;q++) if (en[q].name.indexOf(pref[p]) >= 0) return en[q]; }
  return en[0] || vs.filter(function(v){ return /^en/i.test(v.lang); })[0] || null;
}
function speak(text, opt){
  opt = opt || {};
  return new Promise(function(res){
    text = String(text || '').trim();
    if (!text || !hasTTS){ res(); return; }
    try {
      var u = new SpeechSynthesisUtterance(text);
      var v = getVoice(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.rate = clamp((opt.rate || 1) * S.rate, 0.3, 2);
      var done = false;
      var t = setTimeout(fin, 2500 + text.length * 220 / u.rate);
      function fin(){ if (done) return; done = true; clearTimeout(t); res(); }
      u.onend = fin; u.onerror = fin;
      window.__utter = u;            // keeps Chrome from losing the "done" signal
      var delay = Math.max(0, 150 - (Date.now() - lastCancel));   // Chrome drops speech started right after a stop
      setTimeout(function(){ try { speechSynthesis.resume(); speechSynthesis.speak(u); } catch(e){ fin(); } }, delay);
    } catch(e){ res(); }
  });
}
var lastCancel = 0;
function stopSpeak(){ try { if (hasTTS){ speechSynthesis.cancel(); lastCancel = Date.now(); } } catch(e){} }
if (hasTTS){ try { speechSynthesis.onvoiceschanged = function(){ if (screen === 'appset') fillVoices(); }; voices(); } catch(e){} }

var actx = null;
function tone(freq, start, dur, type, vol){
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    var o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + start;
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch(e){}
}
function sfxHappy(){ if (!S.sfx) return; [523,659,784,1047].forEach(function(f,i){ tone(f, i*0.09, 0.25, 'triangle', 0.22); }); }
function sfxOops(){ if (!S.sfx) return; tone(392,0,0.22,'sine',0.15); tone(311,0.2,0.35,'sine',0.15); }
function sfxTada(){ if (!S.sfx) return; [523,659,784,659,784,1047].forEach(function(f,i){ tone(f, i*0.12, 0.3, 'triangle', 0.22); }); tone(1047,0.75,0.7,'triangle',0.2); }

   LISTENING (speech recognition)
   ========================================================= */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var micBlocked = '';      // reason the microphone can't be used right now
var activeRec = null;
function micAvailable(){ return !!SR && S.useMic && !micBlocked; }
function micMsg(){
  if (!S.useMic) return 'Microphone checking is turned off. Grown-up: listen, then tap ✔ or ✘.';
  if (!SR) return 'This browser can\'t listen for words. No problem! Grown-up: listen, then tap ✔ or ✘. (Tip: Chrome or Edge can listen.)';
  if (micBlocked === 'network') return 'The listening helper needs the internet, and it couldn\'t connect. Grown-up: listen, then tap ✔ or ✘.';
  if (micBlocked === 'nomic') return 'I can\'t find a microphone. Grown-up: listen, then tap ✔ or ✘.';
  return 'The microphone isn\'t allowed right now. No problem! Grown-up: listen, then tap ✔ or ✘. (To allow it, click the little lock or mic icon next to the web address and choose Allow.)';
}
function listen(){
  return new Promise(function(resolve){
    var r, results = [], err = null, finished = false;
    try { r = new SR(); } catch(e){ resolve({ error:'unavailable', results:[] }); return; }
    activeRec = r;
    r.lang = 'en-US'; r.interimResults = false; r.maxAlternatives = 5; r.continuous = false;
    r.onresult = function(e){ for (var i=0;i<e.results.length;i++) for (var j=0;j<e.results[i].length;j++) results.push(e.results[i][j].transcript); };
    r.onerror = function(e){ err = e.error; };
    r.onend = function(){ if (finished) return; finished = true; if (activeRec === r) activeRec = null; resolve({ results:results, error: results.length ? null : (err || 'no-speech') }); };
    try { r.start(); } catch(e){ finished = true; resolve({ error:'start-failed', results:[] }); return; }
    setTimeout(function(){ try { r.stop(); } catch(e){} }, 8000);
    // safety net: never leave the button stuck on "Listening…"
    setTimeout(function(){ if (finished) return; finished = true; try { r.abort(); } catch(e){} if (activeRec === r) activeRec = null; resolve({ results:results, error: results.length ? null : (err || 'no-speech') }); }, 11000);
  });
}
function stopListening(){ if (activeRec){ try { activeRec.abort(); } catch(e){} activeRec = null; } }

var HOMOPHONES = ['to two too 2','see sea c','bee be b','you u ewe yu','are r','for four 4','one won 1','eight ate 8','why y',
  'oh o owe','i eye aye','tea tee t','pea pee p','right write','there their theyre','no know','new knew','by buy bye','hi high',
  'week weak','meet meat','sun son','flower flour','dear deer','here hear','hole whole','blue blew','made maid','tail tale',
  'sale sail','some sum','would wood','not knot','night knight','road rode','pair pear','way weigh','wait weight','which witch',
  'feet feat','ring wring','peace piece','plane plain','mail male','sent cent scent','through threw','been bin','our hour',
  'its it\'s','were whirr','the da duh','of uv','was wuz','what wut','they thay','said sed'];
var HMAP = {};
HOMOPHONES.forEach(function(g){ var ws = g.split(' '); ws.forEach(function(w){ HMAP[w] = (HMAP[w] || []).concat(ws); }); });
function normText(s){ return String(s).toLowerCase().replace(/[’`]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim(); }
function isMatch(target, heard){
  var t = normText(plain(target)); if (!t) return false;
  var accept = {}; [t, t.replace(/'/g,'')].concat(HMAP[t] || HMAP[t.replace(/'/g,'')] || []).forEach(function(w){ accept[w] = 1; });
  for (var i=0;i<heard.length;i++){
    var n = normText(heard[i]); if (!n) continue;
    if (accept[n] || accept[n.replace(/[ ']/g,'')]) return true;
    var ws = n.split(' ');
    for (var j=0;j<ws.length;j++) if (accept[ws[j]] || accept[ws[j].replace(/'/g,'')]) return true;
    if (t.indexOf(' ') >= 0 && n.indexOf(t) >= 0) return true;
  }
  return false;
}

/* =========================================================
   PHONICS HELPERS (highlighting + breaking words into sounds)
   ========================================================= */
function highlightWord(word, target){
  var w = plain(word), lw = w.toLowerCase(), lt = String(target||'').toLowerCase(), out = '', i = 0;
  while (i < w.length){
    if (lt && lw.substr(i, lt.length) === lt){ out += '<span class="hl">' + esc(w.substr(i, lt.length)) + '</span>'; i += lt.length; }
    else { out += esc(w[i]); i++; }
  }
  return out;
}
function segment(word, target, targetSay){
  var segs = [];
  if (word.indexOf('-') >= 0){
    word.split('-').filter(Boolean).forEach(function(t){ segs.push({ t:t, say: (target && t.toLowerCase() === target.toLowerCase() && targetSay) ? targetSay : sayFor(t) }); });
    return segs;
  }
  var w = word.toLowerCase(), tg = String(target||'').toLowerCase(), i = 0, V = 'aeiou';
  while (i < w.length){
    var m = null;
    if (tg && w.substr(i, tg.length) === tg) m = tg;
    else for (var g=0; g<GRAPHEMES.length; g++){ if (w.substr(i, GRAPHEMES[g].length) === GRAPHEMES[g]){ m = GRAPHEMES[g]; break; } }
    if (!m) m = w[i];
    segs.push({ t: word.substr(i, m.length), g:m }); i += m.length;
  }
  var n = segs.length;
  if (n >= 3 && segs[n-1].g === 'e' && segs[n-2].g.length === 1 && V.indexOf(segs[n-2].g) < 0 && segs[n-3].g.length === 1 && V.indexOf(segs[n-3].g) >= 0){
    segs[n-3].long = true; segs[n-1].silent = true;
  }
  if (n >= 2 && segs[n-1].g === 'y' && V.indexOf(segs[n-2].g.slice(-1)) < 0){
    var hasV = segs.slice(0, n-1).some(function(s){ return /[aeiou]/.test(s.g); });
    segs[n-1].yv = hasV ? 'ee' : 'eye';
  }
  segs.forEach(function(s){
    s.say = s.silent ? '' : s.long ? sayFor(s.g + '_e') : s.yv ? s.yv : (tg && s.g === tg && targetSay) ? targetSay : sayFor(s.g);
  });
  return segs;
}

function modal(opts){

var L = null;
function mkCard(o){ o.tries = 0; o.state = null; o.correct = false; return o; }

function buildDeck(k, mode){
  var cards = [], c = k.counts;
  if (mode === 'phonics'){
    k.phonics.filter(function(s){ return s.status === 'new' && s.words.length; }).forEach(function(s){
      cards.push(mkCard({ kind:'sound', sound:s.sound, say:s.say || sayFor(s.sound), label:'sound "' + s.sound + '"', noRequeue:true }));
      pick(s.words, c.phonics).forEach(function(w){ cards.push(mkCard({ kind:'pword', word:w, sound:s.sound, tsay:s.say, review:false, label:plain(w) })); });
    });
    var pool = [];
    k.phonics.filter(function(s){ return s.status === 'review'; }).forEach(function(s){ s.words.forEach(function(w){ pool.push({ w:w, s:s }); }); });
    var rv = pick(pool, c.review);
    if (rv.length){
      cards.push({ kind:'banner' });
      rv.forEach(function(p){ cards.push(mkCard({ kind:'pword', word:p.w, sound:p.s.sound, tsay:p.s.say, review:true, label:plain(p.w) })); });
    }
  } else {
    var lists = k[mode], seen = {};
    function poolOf(status){
      var out = [];
      lists.filter(function(l){ return l.status === status; }).forEach(function(l){ l.words.forEach(function(w){ var key = w.w.toLowerCase(); if (!seen[key + status]){ seen[key + status] = 1; out.push(w); } }); });
      return out;
    }
    var main = pick(poolOf('new'), mode === 'heart' ? c.heart : c.spelling);
    var used = {}; main.forEach(function(w){ used[w.w.toLowerCase()] = 1; });
    var revs = pick(poolOf('review').filter(function(w){ return !used[w.w.toLowerCase()]; }), c.review);
    function card(w, review){
      return mode === 'heart' ? mkCard({ kind:'heart', word:w.w, tricky:w.t.slice(), review:review, label:w.w })
                              : mkCard({ kind:'spell', word:w.w, sentence:w.s, review:review, label:w.w });
    }
    main.forEach(function(w){ cards.push(card(w,false)); });
    if (revs.length){ if (main.length) cards.push({ kind:'banner' }); revs.forEach(function(w){ cards.push(card(w,true)); }); }
  }
  return cards;
}

function startLesson(mode){
  var k = getKid(curKidId); if (!k) return renderHome();
  var deck = buildDeck(k, mode);
  if (!deck.some(function(c){ return c.kind !== 'banner'; })){
    stopAll(); screen = 'empty';
    show('<div class="topbar"><button class="btn-gray small" onclick="A.kid(\'' + k.id + '\')">⬅ Back</button></div>' +
      '<div class="card" style="margin-top:30px"><div class="bigemoji">📝</div><h1>Ask ' + pName() + ' to add your ' + MODES[mode].empty + '!</h1>' +
      '<p class="hint">There\'s nothing to practice here yet.</p><button class="btn-blue big" onclick="A.kid(\'' + k.id + '\')">OK!</button></div>');
    return;
  }
  L = { kidId:k.id, mode:mode, deck:deck, all:deck.slice(), card:null, stars:0, ctok:0, stok:0 };
  nextCard(true);
}
function newSpeech(){ L.stok++; stopSpeak(); return L.stok; }
function alive(tok){ return L && L.stok === tok && screen === 'lesson'; }

function nextCard(first){
  if (!L) return;
  var c = L.card;
  if (!first && c && c.state === 'wrong' && !c.noRequeue && c.tries < S.maxTries){ c.state = null; L.deck.push(c); }
  L.ctok++; newSpeech(); stopListening();
  L.card = L.deck.shift();
  if (!L.card) return finishLesson();
  renderLesson();
}

  }

    var inp = $('spellin'); inp.focus();
    inp.onkeydown = function(e){ if (e.key === 'Enter') A.check(); };
    spellPrompt(c);
  }

function spellPrompt(c){
  var tok = newSpeech();
  (async function(){
    await wait(300); if (!alive(tok)) return;
    await speak(c.word); if (!alive(tok)) return;
    await wait(500); if (!alive(tok)) return;
    if (!String(c.sentence||'').trim()){ await speak(c.word); return; }
    await speak(c.sentence); if (!alive(tok)) return;
    await wait(500); if (!alive(tok)) return;
    await speak(c.word);
  })();
}

function markWrong(heard){
  var c = L && L.card; if (!c || c.kind === 'banner' || c.state) return;
  c.tries++; c.state = 'wrong';
  stopListening(); sfxOops();
  var last = !c.noRequeue && c.tries >= S.maxTries;
  var lastNote = last ? '<p class="hint">💛 We\'ll practice this one again next time!</p>' : '';
  var heardNote = heard ? '<p class="hint">I heard: <b>"' + esc(heard) + '"</b></p>' : '';
  var override = '<div class="overrow"><button class="btn-gray small" onclick="A.override()">👍 Parent Override: mark correct</button></div>';
  var zone = $('zone');
  if (c.kind === 'sound'){
    zone.innerHTML = '<p class="hint">Listen carefully, then say it with me! 👂</p>' +
      '<div class="ctrlrow"><button class="btn-blue big" onclick="A.hear()">🔊 Hear it again</button><button class="btn-green big" onclick="A.next()">Next ➜</button></div>';
    var tk = newSpeech();
    (async function(){ await wait(500); if (!alive(tk)) return; await speak(c.say, {rate:0.8}); await wait(700); if (!alive(tk)) return; await speak(c.say, {rate:0.8}); })();
  } else if (c.kind === 'pword'){
    c.segs = c.segs || segment(c.word, c.sound, c.tsay);
    zone.innerHTML = heardNote + '<p class="hint">Let\'s sound it out together! 🐢</p><div class="segs">' + c.segs.map(function(s,i){
      return (i ? '<span class="dash">-</span>' : '') + '<div class="seg' + (s.silent ? ' silent' : '') + '" id="seg' + i + '" style="background:' + SEG_COLORS[i % SEG_COLORS.length] + '">' + esc(s.t) + (s.silent ? '<small>quiet</small>' : '') + '</div>';
    }).join('') + '</div>' + lastNote +
      '<div class="ctrlrow"><button class="btn-blue big" onclick="A.teach()">🔁 Show me again</button><button class="btn-green big" onclick="A.next()">Next ➜</button></div>' + override;
    teachPhonics(c);
  } else if (c.kind === 'heart'){
    zone.innerHTML = heardNote + '<p class="hint" id="teachmsg">Let\'s look at this heart word! ❤️</p>' + lastNote +
      '<div class="ctrlrow"><button class="btn-blue big" onclick="A.teach()">🔁 Show me again</button><button class="btn-green big" onclick="A.next()">Next ➜</button></div>' + override;
    teachHeart(c);
  } else if (c.kind === 'spell'){
    zone.innerHTML = compareHtml(heard || '', c.word) +
      '<p class="hint" style="font-weight:800">Now type it the right way:</p>' +
      '<input class="spellbox" id="fixin" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Type the word correctly">' +
      '<div class="ctrlrow" id="fixrow"><button class="btn-green big" onclick="A.fix()">Check ✔</button></div>' +
      '<div id="feedback" class="feedback"></div>' + lastNote + override;
    var fi = $('fixin'); fi.focus(); fi.onkeydown = function(e){ if (e.key === 'Enter') A.fix(); };
    var tk2 = newSpeech();
    (async function(){
      await wait(400); if (!alive(tk2)) return;
      await speak(c.word + ' is spelled'); if (!alive(tk2)) return;
      var letters = c.word.toLowerCase().split('');
      for (var i=0;i<letters.length;i++){ if (!alive(tk2)) return; if (LETTER_NAMES[letters[i]]) await speak(LETTER_NAMES[letters[i]], {rate:0.9}); }
      if (!alive(tk2)) return; await wait(300); await speak(c.word);
    })();
  }
}

function teachPhonics(c){
  var tok = newSpeech();
  function hi(i){ c.segs.forEach(function(_,j){ var e = $('seg'+j); if (e) e.classList.toggle('on', i === 'all' || i === j); }); }
  (async function(){
    await wait(500);
    for (var i=0;i<c.segs.length;i++){
      if (!alive(tok)) return; hi(i);
      if (c.segs[i].say) await speak(c.segs[i].say, {rate:0.6}); else await wait(600);
      await wait(350);
    }
    if (!alive(tok)) return; hi(-1); await speak('Now blend it.');
    for (var j=0;j<c.segs.length;j++){
      if (!alive(tok)) return; hi(j);
      if (c.segs[j].say) await speak(c.segs[j].say, {rate:1.1}); else await wait(200);
    }
    if (!alive(tok)) return; hi('all'); await speak(plain(c.word), {rate:0.7});
    if (!alive(tok)) return; await wait(300); await speak(plain(c.word));
  })();
}

function teachHeart(c){
  var tok = newSpeech(), n = c.word.length;
  function hi(fn){ for (var j=0;j<n;j++){ var e = $('lt'+j); if (e){ e.classList.toggle('on', fn(j) === 'on'); e.classList.toggle('glow', fn(j) === 'glow'); } } }
  function msg(t){ var m = $('teachmsg'); if (m) m.textContent = t; }
  (async function(){
    await wait(500); if (!alive(tok)) return;
    msg('Listen: "' + c.word + '"'); await speak(c.word);
    if (!alive(tok)) return; msg('Let\'s spell it! 🔤'); await wait(300);
    for (var i=0;i<n;i++){
      if (!alive(tok)) return;
      hi(function(j){ return j === i ? 'on' : ''; });
      var ch = c.word[i].toLowerCase();
      if (LETTER_NAMES[ch]) await speak(LETTER_NAMES[ch], {rate:0.9}); else await wait(400);
      await wait(250);
    }
    if (!alive(tok)) return;
    if (c.tricky.length){
      var part = c.tricky.slice().sort(function(a,b){return a-b;}).map(function(i){ return c.word[i]; }).join('');
      hi(function(j){ return c.tricky.indexOf(j) >= 0 ? 'glow' : ''; });
      msg('❤️ The heart part is "' + part + '". We learn that part by heart!');
      await speak('The heart part is ' + part.toLowerCase().split('').map(function(x){ return LETTER_NAMES[x] || x; }).join(', ') + '. We learn that part by heart.');
      if (!alive(tok)) return; await wait(300);
    }
    hi(function(){ return ''; }); msg('Say it with me: "' + c.word + '"'); await speak(c.word);
  })();
}

function alignWords(a, b){
  var n = a.length, m = b.length, d = [], i, j;
  for (i=0;i<=n;i++){ d.push([]); for (j=0;j<=m;j++) d[i].push(i===0 ? j : j===0 ? i : 0); }
  for (i=1;i<=n;i++) for (j=1;j<=m;j++){
    var same = a[i-1].toLowerCase() === b[j-1].toLowerCase() ? 0 : 1;
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+same);
  }
  var pairs = []; i = n; j = m;
  while (i > 0 || j > 0){
    if (i>0 && j>0 && d[i][j] === d[i-1][j-1] + (a[i-1].toLowerCase() === b[j-1].toLowerCase() ? 0 : 1)){ pairs.unshift([a[i-1], b[j-1]]); i--; j--; }
    else if (i>0 && d[i][j] === d[i-1][j] + 1){ pairs.unshift([a[i-1], null]); i--; }
    else { pairs.unshift([null, b[j-1]]); j--; }
  }
  return pairs;
}
function compareHtml(typed, correct){
  var pairs = alignWords(typed.split(''), correct.split(''));
  var mine = '', right = '';
  pairs.forEach(function(p){
    var ok = p[0] !== null && p[1] !== null && p[0].toLowerCase() === p[1].toLowerCase();
    if (p[0] !== null) mine += '<span class="' + (ok ? '' : 'bad') + '">' + esc(p[0] === ' ' ? ' ' : p[0]) + '</span>';
    if (p[1] !== null) right += '<span class="' + (ok ? '' : 'fix') + '">' + esc(p[1] === ' ' ? ' ' : p[1]) + '</span>';
  });
  return '<div class="cmp"><div class="cmprow"><div class="cmplabel">You wrote:</div><div class="cmpword">' + (mine || '<span class="bad">?</span>') + '</div></div>' +
    '<div class="cmprow"><div class="cmplabel">Correct:</div><div class="cmpword">' + right + '</div></div></div>';
}
function sameSpelling(a,b){ return String(a).trim().replace(/\s+/g,' ').toLowerCase() === String(b).trim().replace(/\s+/g,' ').toLowerCase(); }

function finishLesson(){
  var k = getKid(L.kidId);
  var scored = L.all.filter(function(c){ return c.kind !== 'banner' && c.kind !== 'sound'; });
  var firstTry = scored.filter(function(c){ return c.correct && c.tries === 0; }).length;
  var missed = scored.filter(function(c){ return c.tries > 0; }).map(function(c){ return c.label; });
  var entry = { date:new Date().toISOString(), mode:L.mode, total:scored.length, firstTry:firstTry, stars:L.stars, missed:missed };
  if (k){ k.history.push(entry); if (k.history.length > 1000) k.history = k.history.slice(-1000); k.stars += L.stars; save(); }
  var mode = L.mode; stopAll(); L = null; screen = 'done';
  var stars = ''; for (var i=0;i<Math.min(entry.stars, 40);i++) stars += '⭐';
  show('<div class="card done" style="margin-top:20px"><div class="bigemoji">🎉</div><h1>Great job' + (k ? ', ' + esc(k.name) : '') + '!</h1>' +
    '<div class="starrow">' + (stars || '💪') + '</div>' +
    '<div class="stat">You earned ⭐ ' + entry.stars + ' star' + (entry.stars === 1 ? '' : 's') + '!</div>' +
    '<div class="stat">Right on the first try: ' + entry.firstTry + ' out of ' + entry.total + '</div>' +
    '<div class="missbox"><b>' + (missed.length ? '📋 Words to practice:' : '🏆 No missed words — perfect!') + '</b><br>' +
      missed.map(function(w){ return '<span class="chip">' + esc(w) + '</span>'; }).join('') + '</div>' +
    '<div class="ctrlrow"><button class="btn-orange big" onclick="A.start(\'' + mode + '\')">🔁 Practice Again</button>' +
    '<button class="btn-green big" onclick="A.kid(\'' + (k ? k.id : '') + '\')">✅ All Done</button></div></div>');
  sfxTada(); confetti();
}
function confetti(){
  var bits = ['⭐','🎉','🌟','🎈','✨','💖','🟡','🟣','🔵'];
  for (var i=0;i<45;i++){
    var s = document.createElement('div'); s.className = 'confetti';
    s.textContent = bits[i % bits.length];
    s.style.left = (Math.random()*100) + 'vw';
    s.style.animationDuration = (2.2 + Math.random()*2) + 's';
    s.style.animationDelay = (Math.random()*0.8) + 's';
    document.body.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 5200); })(s);
  }
}

var pin = { mode:'enter', buf:'', first:'' };
function renderPin(mode, msg, err){
  stopAll(); L = null; screen = 'pin';
  pin.mode = mode; pin.buf = '';
  var title = mode === 'enter' ? '🔒 Parent Settings' : mode === 'create1' ? '🔑 Make a Parent PIN' : '🔑 Type the PIN again';
  var sub = msg || (mode === 'enter' ? 'Type your 4-number PIN.' : mode === 'create1' ? 'Pick 4 numbers you will remember. Kids won\'t be able to open settings without it.' : 'Type the same 4 numbers one more time.');
  var keys = ['1','2','3','4','5','6','7','8','9','del','0','ok'];
  show('<div class="topbar"><button class="btn-gray small" onclick="A.home()">🏠 Home</button></div><div class="pinwrap panel">' +
    '<h1>' + title + '</h1><p id="pinmsg" style="' + (err ? 'color:#c62828;font-weight:800' : '') + '">' + esc(sub) + '</p>' +
    '<div class="dots" id="dots"></div><div class="keypad">' + keys.map(function(k){
      if (k === 'del') return '<button onclick="A.pinKey(\'del\')" aria-label="Delete">⌫</button>';
      if (k === 'ok') return '<button onclick="A.pinKey(\'clear\')" aria-label="Clear">✖</button>';
      return '<button onclick="A.pinKey(\'' + k + '\')">' + k + '</button>';
    }).join('') + '</div>' +
    (mode === 'enter' ? '<p><button class="btn-white small" onclick="A.forgotPin()">🤔 Forgot PIN?</button></p>' : '') + '</div>');
  drawDots(err);
}
function drawDots(shake){
  var d = $('dots'); if (!d) return;
  var h = ''; for (var i=0;i<4;i++) h += '<div class="dot' + (i < pin.buf.length ? ' full' : '') + '"></div>';
  d.innerHTML = h;
  if (shake){ d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); }
}
function pinKey(k){
  if (screen !== 'pin') return;
  if (k === 'del') pin.buf = pin.buf.slice(0,-1);
  else if (k === 'clear') pin.buf = '';
  else if (pin.buf.length < 4) pin.buf += k;
  drawDots();
  if (pin.buf.length === 4){
    var b = pin.buf;
    setTimeout(function(){
      if (pin.mode === 'enter'){
        if (b === S.pin){ unlocked = true; renderSettings(); }
        else renderPin('enter', 'That PIN didn\'t match. Try again!', true);
      } else if (pin.mode === 'create1'){ pin.first = b; renderPin('create2'); }
      else if (pin.mode === 'create2'){
        if (b === pin.first){ S.pin = b; save(); unlocked = true; toast('PIN saved! 🔑'); renderSettings(); }
        else renderPin('create1', 'Those didn\'t match. Let\'s start over — pick 4 numbers.', true);
      }
    }, 180);
  }
}
document.addEventListener('keydown', function(e){
  if (screen !== 'pin' || document.querySelector('.modalwrap')) return;
  if (/^\d$/.test(e.key)) pinKey(e.key);
  else if (e.key === 'Backspace') pinKey('del');
});

function edList(){ var k = ED && getKid(ED.kidId); return k ? getList(k, ED.mode, ED.listId) : null; }
/* Copies the words box into the saved list. Returns true if anything was saved. */
function syncWords(always){
  var l = edList(), box = $('wordsbox'); if (!l || !box) return false;
  var words = parseWords(box.value), old = {};
  if (ED.mode === 'phonics') words = dedupe(words.map(function(w){ return w.toLowerCase(); }));
  var cur = l.words.map(function(w){ return typeof w === 'string' ? w : w.w; });
  if (!always && words.join('|') === cur.join('|')) return false;
  if (ED.mode === 'phonics') l.words = words;
  else {
    l.words.forEach(function(w){ old[w.w.toLowerCase()] = w; });
    l.words = words.map(function(w){
      var o = old[w.toLowerCase()];
      if (ED.mode === 'heart') return { w:w, t: o && o.w === w ? o.t.slice() : [] };
      return { w:w, s: o ? o.s : '' };
    });
  }
  save(); toast('Words saved! (' + l.words.length + ')');
  return true;
}

var A = window.A = {
  home: function(){ renderHome(); },
  kid: function(id){ renderKid(id); },
  start: function(mode){ startLesson(mode); },
  help: function(){ renderHelp(); },
  next: function(){ if (L && L.card && (L.card.kind === 'banner' || L.card.kind === 'sound' || L.card.state === 'wrong')) nextCard(); },
  quit: function(){
    confirmBox('Stop this lesson?', 'Stars from this lesson won\'t be saved.', 'Yes, stop', 'btn-red').then(function(ok){ if (ok) renderKid(L ? L.kidId : curKidId); });
  },
  hear: function(){
    var c = L && L.card; if (!c) return;
    if (c.kind === 'spell'){ spellPrompt(c); return; }
    newSpeech();
    if (c.kind === 'sound') speak(c.say, {rate:0.8});
    else speak(plain(c.word), {rate:0.85});
  },
  teach: function(){ var c = L && L.card; if (!c || c.state !== 'wrong') return; if (c.kind === 'pword') teachPhonics(c); else if (c.kind === 'heart') teachHeart(c); },
  right: function(){ markCorrect(false); },
  wrong: function(){ markWrong(''); },
  override: function(){ markCorrect(true); },
  mic: function(){
    var c = L && L.card; if (!c || c.state || activeRec) return;
    var btn = $('micbtn'); if (!btn) return;
    newSpeech();
    btn.classList.add('listening'); btn.textContent = '👂 Listening…';
    setFeedback('<span class="muted">Say the word now!</span>');
    var tok = L.ctok;
    listen().then(function(res){
      if (!L || L.ctok !== tok || L.card !== c || c.state) return;
      var b = $('micbtn'); if (b){ b.classList.remove('listening'); b.textContent = '🎤 Say it'; }
      if (res.results.length){
        if (isMatch(c.word, res.results)) markCorrect(false);
        else markWrong(res.results[0]);
        return;
      }
      var e = res.error;
      if (e === 'not-allowed' || e === 'service-not-allowed'){ micBlocked = 'blocked'; renderLesson(); toast('The microphone isn\'t allowed. Use ✔ / ✘ instead.'); }
      else if (e === 'network'){ micBlocked = 'network'; renderLesson(); toast('Listening needs the internet. Use ✔ / ✘ instead.'); }
      else if (e === 'audio-capture'){ micBlocked = 'nomic'; renderLesson(); toast('No microphone found. Use ✔ / ✘ instead.'); }
      else setFeedback('🙉 I didn\'t hear anything. Tap 🎤 and try again!');
    });
  },
  check: function(){
    var c = L && L.card; if (!c || c.kind !== 'spell' || c.state) return;
    var v = ($('spellin') || {}).value || '';
    if (!v.trim()){ setFeedback('✏️ Type the word first!'); return; }
    if (sameSpelling(v, c.word)) markCorrect(false); else markWrong(v.trim());
  },

    var c = L && L.card; if (!c || c.state !== 'wrong') return;

      $('fixrow').innerHTML = '<button class="btn-green big" onclick="A.next()" id="nextbtn">Next ➜</button>';
      $('nextbtn').focus();
    } else { setFeedback('Not quite — look at the green letters and try again! 💪'); inp.select(); }
  },

    var nm = mode === 'phonics' ? 'the "' + esc(l.sound || '?') + '" sound' : 'the list "' + esc(l.name) + '"';
    confirmBox('Delete?', 'Delete ' + nm + ' and its ' + l.words.length + ' words?', 'Yes, delete', 'btn-red').then(function(ok){

    });

  setL: function(field, v){
    var l = edList(); if (!l) return;
    if (field === 'sound') v = String(v).trim().toLowerCase();
    else if (field === 'name') v = String(v).trim() || 'My List';
    else if (field === 'say') v = String(v).trim();
    if (field === 'status') syncWords();
    l[field] = v; save(); toast('Saved!');
    if (field === 'status') renderEditList();
    else if (field === 'sound'){ var sy = $('lsay'); if (sy) sy.placeholder = sayFor(v); }

  trick: function(wi, i){
    syncWords();
    var l = edList(); if (!l || !l.words[wi]) return;
    var t = l.words[wi].t, at = t.indexOf(i);
    if (at >= 0) t.splice(at, 1); else t.push(i);
    t.sort(function(a,b){return a-b;}); save(); renderEditList();
  },
  testSentence: function(wi){

    stopSpeak(); speak(w.w).then(function(){ return w.s ? speak(w.s) : null; }).then(function(){ return speak(w.w); });
  },
  testSay: function(){ var l = edList(); if (!l) return; var box = $('lsay'); var v = box ? box.value.trim() : l.say; stopSpeak(); speak(v || sayFor(l.sound), {rate:0.8}); },
  doneList: function(){
    syncWords();
    var k = getKid(ED.kidId), l = edList();
    if (k && l && ED.mode === 'phonics' && !l.sound && !l.words.length) k.phonics = k.phonics.filter(function(x){ return x.id !== l.id; });
    save(); renderSetKid(ED.kidId);
  },
  setApp: function(key, v){
    if (key === 'rate') v = clamp(v, 0.4, 1.5);
    if (key === 'maxTries') v = Math.round(clamp(v, 1, 10));
    if (key === 'parentName'){ v = String(v).trim() || 'Momma'; }
    if (key === 'useMic' && v) micBlocked = '';
    S[key] = v; save(); toast('Saved!');
    if (key === 'useMic' || key === 'sfx') renderAppSettings();
  },
  retryMic: function(){ micBlocked = ''; toast('OK! The microphone will be tried again.'); renderAppSettings(); },
  testVoice: function(){ stopSpeak(); speak('Hi! Let\'s practice. Great job!'); },
  saveSayHelper: function(){
    var box = $('sayhelper'); if (!box) return;
    var out = {};
    box.value.split(/\n/).forEach(function(line){
      var m = line.split('='); if (m.length < 2) return;
      var k = m[0].trim().toLowerCase(), v = m.slice(1).join('=').trim();
      if (k && v && DEFAULT_SAY[k] !== v) out[k] = v;
    });
    S.soundSay = out; save(); toast('Sounds saved!'); renderAppSettings();
  },
  resetSayHelper: function(){
    confirmBox('Reset sounds?', 'Put all sounds back to the original way?', 'Reset', 'btn-orange').then(function(ok){ if (ok){ S.soundSay = {}; save(); renderAppSettings(); } });
  },
  testHelper: function(){
    var v = String(($('saytest') || {}).value || '').trim().toLowerCase(); if (!v) return;
    var box = $('sayhelper'), said = null;
    if (box){
      box.value.split(/\n/).forEach(function(line){
        var m = line.split('='); if (m.length < 2) return;
        if (m[0].trim().toLowerCase() === v){ var val = m.slice(1).join('=').trim(); if (val) said = val; }
      });
    }
    stopSpeak(); speak(said || sayFor(v), {rate:0.8});
    if (said && said !== sayFor(v)) toast('Testing your new sound — tap Save Sounds to keep it!');
  },
  saveBackup: function(){
    try {
      var data = JSON.stringify({ app:'momma-practice-app', type:'backup', version:1, savedAt:new Date().toISOString(), data:S }, null, 2);
      var blob = new Blob([data], { type:'application/json' });
      var a = document.createElement('a'), d = new Date();
      var ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      a.href = URL.createObjectURL(blob); a.download = 'practice-backup-' + ds + '.json';
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      alertBox('Backup saved! 💾', 'Look in your <b>Downloads</b> folder for <b>' + esc(a.download) + '</b>. Keep it somewhere safe, like a USB stick or your email.');
    } catch(e){ alertBox('Oops', 'The backup could not be saved on this browser.'); }
  },
  loadLists: function(input){
    var f = input.files && input.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      var obj = null, norm = null;
      try { obj = JSON.parse(r.result); norm = normalize(obj && obj.data ? obj.data : obj); } catch(e){}
      input.value = '';
      if (!norm){ alertBox('Hmm, that didn\'t work', 'That file isn\'t a backup from this app. Please pick a file named like <b>practice-backup-….json</b>.'); return; }
      var when = obj && obj.savedAt ? new Date(obj.savedAt).toLocaleString() : 'an unknown date';
      confirmBox('Load lists only?', 'Lists from <b>' + esc(when) + '</b> for: ' + esc(norm.kids.map(function(k){ return k.name; }).join(', ')) +
        '.<br><br>This <b>replaces the word lists</b> on this computer. <b>Stars and history stay safe.</b>', 'Yes, load lists', 'btn-teal').then(function(ok){
        if (!ok) return;
        var updated = [], added = [];
        norm.kids.forEach(function(nk){
          var match = getKid(nk.id);
          if (!match){ for (var i=0;i<S.kids.length;i++) if (S.kids[i].name.trim().toLowerCase() === nk.name.trim().toLowerCase()){ match = S.kids[i]; break; } }
          if (match){
            match.phonics = nk.phonics; match.heart = nk.heart; match.spelling = nk.spelling;
            match.modes = nk.modes; match.counts = nk.counts;
            updated.push(match.name);
          } else {
            nk.stars = 0; nk.history = []; if (getKid(nk.id)) nk.id = uid();
            S.kids.push(nk); added.push(nk.name);
          }
        });
        save();
        alertBox('Lists loaded! 🎉', (updated.length ? 'Updated: <b>' + esc(updated.join(', ')) + '</b>. ' : '') +
          (added.length ? 'Added new: <b>' + esc(added.join(', ')) + '</b>. ' : '') + 'Stars and history were kept.');
        renderSettings();
      });
    };
    r.onerror = function(){ alertBox('Oops', 'That file could not be read.'); };
    r.readAsText(f);
  },
  loadBackup: function(input){
    var f = input.files && input.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      var obj = null, norm = null;
      try { obj = JSON.parse(r.result); norm = normalize(obj && obj.data ? obj.data : obj); } catch(e){}
      input.value = '';
      if (!norm){ alertBox('Hmm, that didn\'t work', 'That file isn\'t a backup from this app. Please pick a file named like <b>practice-backup-….json</b>.'); return; }
      var when = obj && obj.savedAt ? new Date(obj.savedAt).toLocaleString() : 'an unknown date';
      confirmBox('Load this backup?', 'Backup from <b>' + esc(when) + '</b> with ' + norm.kids.length + ' kid(s): ' + esc(norm.kids.map(function(k){ return k.name; }).join(', ')) +
        '.<br><br>This <b>replaces</b> everything in the app on this computer.', 'Yes, load it', 'btn-orange').then(function(ok){
        if (!ok) return; S = norm; save(); toast('Backup loaded! 🎉'); renderSettings();
      });
    };
    r.onerror = function(){ alertBox('Oops', 'That file could not be read.'); };
    r.readAsText(f);
  }
};

renderHome();
})();
</script>
